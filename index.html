<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Adinn Panorama Viewer</title>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app { height: 100%; width: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: #fff; color: #000;
      overflow: hidden;
    }

    .app { display: flex; flex-direction: column; height: 100vh; }

    header {
      display: flex; align-items: center; gap: .75rem;
      padding: .6rem 1rem; background: #fff; border-bottom: 1px solid #ddd;
    }
    header .logo { height: 50px; width: auto; }
    header .brand { font-weight:700; font-size:1rem; color:#000; }
    header .spacer { flex: 1; }
    .controls { display:flex; gap:.5rem; align-items:center; }

    button {
      background: #000; color: #fff; border: 0; padding: .45rem .7rem;
      border-radius:6px; cursor: pointer; font-size: 0.95rem;
    }

    main {
      display: flex; flex: 1; min-height: 0;
    }

    #viewer-wrap {
      position: relative; flex: 1; overflow: hidden;
    }
    #viewer-canvas { width: 100%; height: 100%; }

    .status, .hint {
      position: absolute; padding: .45rem .6rem; border-radius: 6px;
      background: rgba(0,0,0,0.65); color: #fff; font-size: .85rem; z-index: 20;
    }
    .status { left: 12px; bottom: 12px; }
    .hint { right: 12px; bottom: 12px; }

    /* Sidebar thumbnails (desktop default) */
    .sidebar {
      width: 160px; background: #f8f8f8; border-left: 1px solid #e0e0e0;
      display: flex; flex-direction: column; gap: .6rem;
      padding: .6rem; overflow-y: auto; overflow-x: hidden;
    }
    .thumb { border-radius:6px; overflow:hidden; border:2px solid transparent; cursor:pointer; }
    .thumb img { display:block; width:100%; height:auto; object-fit:cover; }
    .thumb.active { border-color:#000; }

    footer {
      padding: .4rem 1rem; background: #fff; border-top: 1px solid #eee;
      font-size: .82rem; text-align: center;
    }

    canvas { cursor: grab; display:block; width:100%; height:100%; }
    canvas:active { cursor: grabbing; }

    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      animation: spin 1s linear infinite;
      display: inline-block; vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* -------- MOBILE VIEW -------- */
    @media (max-width: 800px) {
      main { flex-direction: column; }
      .sidebar {
        width: 100%; height: auto;
        flex-direction: row; justify-content: center; align-items: center;
        padding: .6rem; background: #f8f8f8;
        border-left: none; border-top: 1px solid #e0e0e0;
        overflow-x: auto; overflow-y: hidden;
      }
      .thumb { width: 100px; flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <img src="Images/Logo.jpg" alt="Logo" class="logo" onerror="this.style.display='none'">
      <div class="brand">Panorama Viewer</div>
      <div class="spacer"></div>
      <div class="controls">
        <button id="btn-autorotate" title="Toggle autorotate">Autoplay: ON</button>
        <button id="btn-reset" title="Reset view">Reset</button>
      </div>
    </header>

    <main>
      <div id="viewer-wrap">
        <div id="viewer-canvas"></div>
        <div class="status" id="status">Loading...</div>
        <div class="hint">Drag (or touch) to look around • Double-click to fullscreen</div>
      </div>

      <aside class="sidebar" id="sidebar">
        <!-- Thumbnails inserted here -->
      </aside>
    </main>

    <footer>Tip: Use a high-resolution equirectangular image (2:1 ratio)</footer>
  </div>

  <script>
  (function () {
    const IMAGES = [
      'Images/panorama1.jpg',
      'Images/panorama2.jpg',
      'Images/panorama3.jpg'
    ];
    const MIN_PITCH = -Math.PI * 0.25;
    const MAX_PITCH =  Math.PI * 0.25;

    // Adjusted sensitivity
    const BASE_SENSITIVITY = 0.0015;
    const MOBILE_SENSITIVITY = 0.030; // faster pan for mobile
    const DAMPING = 0.08;
    const AUTOPLAY_SPEED = 0.05;

    // Auto-detect sensitivity for device
    let SENSITIVITY = (window.innerWidth <= 800 || 'ontouchstart' in window)
      ? MOBILE_SENSITIVITY
      : BASE_SENSITIVITY;

    let scene, camera, renderer, textureLoader;
    let sphereMesh = null;
    let canvasEl = null;

    let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
    let isPointerDown = false;
    let pointerStartX = 0, pointerStartY = 0;
    let baseTargetYaw = 0, baseTargetPitch = 0;
    let autoplay = true;

    const statusEl = document.getElementById('status');
    const sidebarEl = document.getElementById('sidebar');
    const btnAuto = document.getElementById('btn-autorotate');
    const btnReset = document.getElementById('btn-reset');

    function init() {
      const container = document.getElementById('viewer-canvas');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 2000);
      camera.position.set(0, 0, 0.1);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      container.appendChild(renderer.domElement);
      canvasEl = renderer.domElement;

      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
      sphereMesh = new THREE.Mesh(geometry, material);
      scene.add(sphereMesh);

      textureLoader = new THREE.TextureLoader();
      window.addEventListener('resize', onWindowResize, { passive: true });
      canvasEl.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      canvasEl.addEventListener('wheel', onWheel, { passive: false });
      canvasEl.addEventListener('dblclick', onDoubleClick);

      buildSidebar(IMAGES);
      loadPanorama(IMAGES[0]);

      btnAuto.addEventListener('click', () => {
        autoplay = !autoplay;
        btnAuto.textContent = autoplay ? 'Autoplay: ON' : 'Autoplay: OFF';
      });
      btnReset.addEventListener('click', () => {
        targetYaw = 0; targetPitch = 0;
      });
    }

    function buildSidebar(list) {
      sidebarEl.innerHTML = '';
      list.forEach((src, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'thumb';
        const img = document.createElement('img');
        img.src = src;
        wrapper.appendChild(img);
        wrapper.addEventListener('click', () => {
          loadPanorama(src);
          document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
          wrapper.classList.add('active');
        });
        if (idx === 0) wrapper.classList.add('active');
        sidebarEl.appendChild(wrapper);
      });
    }

    function loadPanorama(path) {
      statusEl.innerHTML = `<span class="spinner"></span> Loading...`;
      return new Promise((resolve, reject) => {
        textureLoader.load(
          path,
          (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            if (sphereMesh.material.map) sphereMesh.material.map.dispose();
            sphereMesh.material.map = tex;
            sphereMesh.material.needsUpdate = true;
            statusEl.textContent = 'Viewing: ' + path.split('/').pop();
            resolve(tex);
          },
          undefined,
          (err) => {
            statusEl.textContent = 'Failed to load';
            reject(err);
          }
        );
      });
    }

    function onPointerDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      isPointerDown = true;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      baseTargetYaw = targetYaw;
      baseTargetPitch = targetPitch;
      canvasEl.style.cursor = 'grabbing';
    }

    function onPointerMove(e) {
      if (!isPointerDown) return;
      const dx = e.clientX - pointerStartX;
      const dy = e.clientY - pointerStartY;
      targetYaw = baseTargetYaw - dx * SENSITIVITY;
      targetPitch = Math.max(MIN_PITCH, Math.min(MAX_PITCH, baseTargetPitch + dy * SENSITIVITY));
    }

    function onPointerUp() {
      isPointerDown = false;
      canvasEl.style.cursor = 'grab';
    }

    function onWheel(e) {
      e.preventDefault();
      camera.fov = Math.max(30, Math.min(100, camera.fov + e.deltaY * 0.02));
      camera.updateProjectionMatrix();
    }

    function onDoubleClick() {
      const elem = document.getElementById('viewer-wrap');
      if (!document.fullscreenElement) elem.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (autoplay && !isPointerDown) targetYaw += AUTOPLAY_SPEED * 0.016;
      yaw += (targetYaw - yaw) * 0.1;
      pitch += (targetPitch - pitch) * 0.1;
      const phi = Math.PI / 2 - pitch, theta = yaw;
      const x = Math.sin(phi) * Math.cos(theta);
      const y = Math.cos(phi);
      const z = Math.sin(phi) * Math.sin(theta);
      camera.lookAt(new THREE.Vector3(x, y, z));
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('viewer-canvas');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);

      // update pan speed dynamically if window resized
      SENSITIVITY = (window.innerWidth <= 800 || 'ontouchstart' in window)
        ? MOBILE_SENSITIVITY
        : BASE_SENSITIVITY;
    }

    init();
    animate();
  })();
  </script>
</body>
</html>
